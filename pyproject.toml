[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim800-capabilities"
version = "0.1.0"
description = "Data-driven capability database for SIM800 family modules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Nazarvand" }]
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cli = ["click>=8.0", "rich>=13.0"]
dev = ["pytest>=7.0"]

[project.scripts]
sim800-capabilities = "sim800_capabilities.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sim800_capabilities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]